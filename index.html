<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0a0e17">
<title>Cappd</title>
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Cappd">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<style>
:root{--bg:#0b1020;--card:#141b30;--card2:#1b2440;--line:#26304f;--text:#eef1f8;--mute:#8d97b5;--accent:#7c5cff;--empty:#2a3352;--pend:#f2a93b;--ok:#2fc787;--seen:#4aa3ff;--bad:#ef5350;--r:14px}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);font:15px/1.4 -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,sans-serif}
button,input,select,textarea{font:inherit;color:inherit}
.app{max-width:520px;margin:0 auto;min-height:100vh;padding:calc(env(safe-area-inset-top) + 8px) 14px calc(env(safe-area-inset-bottom) + 84px)}
header.top{display:flex;align-items:center;gap:10px;padding:6px 2px 12px}
header.top h1{font-size:24px;margin:0;font-weight:700;letter-spacing:-.3px;flex:1}
.back{background:none;border:0;color:var(--accent);font-size:16px;padding:6px 0;cursor:pointer}
.sub{color:var(--mute);font-size:13px}
.banner{background:#2a2142;border:1px solid #4b3a86;border-radius:var(--r);padding:10px 12px;font-size:13px;color:#d9d0ff;margin-bottom:12px}
.setcard{background:var(--card);border-radius:var(--r);padding:14px;margin-bottom:10px;cursor:pointer;border:1px solid var(--line)}
.setcard h3{margin:0 0 2px;font-size:16px}
.bar{height:6px;background:var(--empty);border-radius:3px;overflow:hidden;margin-top:10px}
.bar>i{display:block;height:100%;background:var(--ok)}
.stats{display:flex;gap:14px;margin-top:8px;font-size:12px;color:var(--mute)}
.stats b{color:var(--text)}
.pills{display:flex;gap:8px;overflow-x:auto;padding:2px 0 10px;scrollbar-width:none}
.pills::-webkit-scrollbar{display:none}
.pill{flex:0 0 auto;border:1px solid var(--line);background:var(--card);border-radius:999px;padding:6px 12px;font-size:13px;cursor:pointer;white-space:nowrap}
.pill.on{background:var(--accent);border-color:var(--accent);color:#fff}
.row{display:flex;gap:8px;margin-bottom:10px}
.search{flex:1;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:9px 12px;outline:none}
.seg{display:flex;background:var(--card);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.seg button{background:none;border:0;padding:8px 10px;font-size:12px;color:var(--mute);cursor:pointer}
.seg button.on{background:var(--card2);color:var(--text)}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.tile{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px;cursor:pointer;min-height:84px;display:flex;flex-direction:column}
.tile .no{font-size:11px;color:var(--mute)}
.tile .pl{font-weight:600;font-size:14px;margin:2px 0;line-height:1.2}
.tile .tm{font-size:11px;color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dots{display:flex;flex-wrap:wrap;gap:3px;margin-top:auto;padding-top:8px}
.dot{width:8px;height:8px;border-radius:2px;background:var(--empty)}
.dot.p{background:var(--pend)}.dot.v{background:var(--ok)}
.tile.hasv{border-color:#1f6b4d}.tile.hasp{border-color:#6b5320}
.legend{display:flex;gap:12px;font-size:12px;color:var(--mute);margin:4px 0 10px}
.legend span::before{content:"";display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:5px;vertical-align:-1px;background:var(--c)}
nav.tabs{position:fixed;left:0;right:0;bottom:0;background:rgba(11,16,32,.94);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-top:1px solid var(--line);display:flex;justify-content:center;padding:6px 0 calc(env(safe-area-inset-bottom) + 6px);z-index:5}
nav.tabs .in{display:flex;max-width:520px;width:100%}
nav.tabs button{flex:1;background:none;border:0;color:var(--mute);font-size:11px;padding:4px 0;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px}
nav.tabs button svg{width:24px;height:24px}
nav.tabs button.on{color:var(--accent)}
nav.tabs .plus{background:var(--accent);color:#fff;border-radius:50%;width:44px;height:44px;display:flex;align-items:center;justify-content:center;margin-top:-4px}
.sheetbg{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:10;display:none}
.sheet{position:fixed;left:0;right:0;bottom:0;max-height:88vh;overflow-y:auto;background:var(--card);border-radius:18px 18px 0 0;z-index:11;padding:8px 16px calc(env(safe-area-inset-bottom) + 20px);transform:translateY(100%);transition:transform .25s ease;max-width:520px;margin:0 auto}
.sheet.open{transform:none}
.grab{width:38px;height:5px;background:var(--line);border-radius:3px;margin:4px auto 12px}
.sheet h2{margin:0;font-size:19px}
.slots{display:grid;grid-template-columns:repeat(auto-fill,minmax(46px,1fr));gap:6px;margin:12px 0}
.slot{aspect-ratio:1;border-radius:10px;border:1px solid var(--line);background:var(--empty);display:flex;align-items:center;justify-content:center;font-size:12px;cursor:pointer;flex-direction:column}
.slot.p{background:#4a3814;border-color:var(--pend)}.slot.v{background:#11402e;border-color:var(--ok)}
.slot small{font-size:9px;color:var(--mute)}
.one{display:flex;align-items:center;justify-content:center;height:120px;border-radius:14px;border:1px dashed var(--line);margin:12px 0;cursor:pointer;flex-direction:column;gap:4px}
.one.p{border:1px solid var(--pend);background:#2e2412}.one.v{border:1px solid var(--ok);background:#0f2e22}
label.f{display:block;font-size:12px;color:var(--mute);margin:12px 0 4px}
.inp{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 12px;outline:none}
textarea.inp{min-height:64px;resize:vertical}
.btn{display:block;width:100%;border:0;border-radius:12px;padding:13px;font-weight:600;background:var(--accent);color:#fff;cursor:pointer;margin-top:16px}
.btn.ghost{background:var(--card2);color:var(--text)}
.btn.red{background:#3a1d24;color:#ff9a9a}
.btns{display:flex;gap:8px}.btns .btn{flex:1}
.code{font:600 22px ui-monospace,Menlo,monospace;letter-spacing:4px;background:var(--bg);border:1px dashed var(--accent);border-radius:10px;padding:10px;text-align:center;margin-top:6px}
.hint{font-size:12px;color:var(--mute);margin-top:6px}
.badge{display:inline-block;font-size:10px;font-weight:700;padding:2px 7px;border-radius:999px;vertical-align:1px}
.b-p{background:#4a3814;color:#ffd08a}.b-v{background:#11402e;color:#8ff0c3}.b-r{background:#3a1d24;color:#ff9a9a}.b-s{background:#2a2142;color:#c9bbff}
.item{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:12px;margin-bottom:8px}
.item .t{font-weight:600}
.item .m{font-size:12px;color:var(--mute);margin-top:3px}
.item a{color:var(--accent)}
.prof{background:var(--card);border-radius:var(--r);padding:16px;border:1px solid var(--line);margin-bottom:12px}
.big{font-size:32px;font-weight:700}
.switch{display:flex;align-items:center;justify-content:space-between;padding:12px 0;border-bottom:1px solid var(--line)}
.switch:last-child{border:0}
.tog{width:46px;height:28px;border-radius:14px;background:var(--empty);position:relative;cursor:pointer;border:0;flex:0 0 auto}
.tog::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:left .2s}
.tog.on{background:var(--ok)}.tog.on::after{left:21px}
.thumb{max-width:100%;max-height:200px;border-radius:10px;margin-top:8px;display:block}
.toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top) + 14px);transform:translateX(-50%);background:var(--card2);border:1px solid var(--line);padding:10px 16px;border-radius:12px;z-index:20;font-size:14px;display:none;max-width:90vw}
.empty{color:var(--mute);text-align:center;padding:30px 10px}
.rules li{margin:4px 0;font-size:13px;color:#c9cfe2}
a.src{color:var(--mute);font-size:12px}
.dot.s{background:var(--seen)}.slot.s{background:#12304d;border-color:var(--seen)}.one.s{border:1px solid var(--seen);background:#0f2236}.tile.hass{border-color:#1f4f7a}.b-o{background:#12304d;color:#9fd0ff}
.grp{width:100%;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-bottom:10px;-webkit-appearance:none;appearance:none}
.unk{font-size:11px;color:#9fd0ff;margin-top:4px}
.sbar{height:8px;background:var(--empty);border-radius:4px;overflow:hidden;margin-top:6px;display:flex}
.sbar>i{display:block;height:100%}
.prog{margin-top:10px}
.prog .pl,.prof .pl{display:flex;justify-content:space-between;font-size:12px;color:var(--mute)}
.prog .pl b,.prof .pl b{color:var(--text);font-weight:600}
.seg.wide{display:flex}.seg.wide button{flex:1;padding:10px;font-size:14px}
a.item.news{display:block;text-decoration:none;color:inherit}
.chip{display:inline-block;font-size:11px;font-weight:600;padding:2px 8px;border-radius:999px;background:#12304d;color:#9fd0ff;margin-bottom:6px}
.chip.c{background:#2a2142;color:#c9bbff}
.cand{display:flex;gap:8px;align-items:flex-start;font-size:13px;padding:6px 0;color:#c9cfe2}
.mini{background:none;border:1px solid var(--line);color:var(--mute);border-radius:999px;padding:5px 10px;font-size:12px;cursor:pointer;white-space:nowrap}
.mini.acc{border-color:var(--accent);color:#fff;background:var(--accent)}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
.kpis div{background:var(--bg);border-radius:10px;padding:8px 10px}
.kpis b{display:block;font-size:16px}
.kpis span{font-size:11px;color:var(--mute)}
.crow{display:flex;gap:10px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:6px;cursor:pointer}
.crow .l{flex:1;min-width:0}
.crow .pl{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.crow .ds{font-size:12px;color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.crow .r{text-align:right;flex:0 0 auto}
.crow .r b{display:block}
.crow .r span{font-size:11px;color:var(--mute)}
.g{color:var(--ok)}.o{color:var(--pend)}.rd{color:var(--bad)}.pu{color:#b18cff}.nt{color:var(--text)}
.tag{display:inline-block;font-size:10px;font-weight:600;padding:1px 6px;border-radius:6px;background:var(--card2);color:#c9cfe2;margin-right:4px}
.legend2{display:flex;flex-wrap:wrap;gap:10px;font-size:12px;color:var(--mute);margin-top:8px}
.legend2 span::before{content:"";display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:5px;vertical-align:-1px;background:var(--c)}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:14px;margin-top:12px}
.kv dt{color:var(--mute)}.kv dd{margin:0;text-align:right}
.links{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.links a{color:var(--accent);font-size:13px;border:1px solid var(--line);border-radius:999px;padding:6px 12px;text-decoration:none}
.sec{font-size:13px;font-weight:600;color:var(--mute);margin:18px 2px 8px;text-transform:uppercase;letter-spacing:.4px}
select.inp{-webkit-appearance:none;appearance:none}
/* photos, Display tab, comp sprint */
.cth{width:40px;height:56px;border-radius:6px;background:var(--card2);flex:0 0 auto;overflow:hidden;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;color:var(--mute)}
.cth img{width:100%;height:100%;object-fit:cover}
.phs{display:flex;gap:8px;overflow-x:auto;scroll-snap-type:x mandatory;margin:0 -16px 10px;padding:0 16px;scrollbar-width:none}
.phs::-webkit-scrollbar{display:none}
.ph{flex:0 0 auto;width:62%;max-width:240px;aspect-ratio:5/7;border-radius:12px;overflow:hidden;background:var(--bg);scroll-snap-align:start;position:relative}
.ph img{width:100%;height:100%;object-fit:contain}
.ph.add{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;border:1px dashed var(--line);color:var(--mute);font-size:13px;cursor:pointer;width:38%}
.ph.add span{font-size:30px;line-height:1;color:var(--accent)}
.phx{position:absolute;top:6px;right:6px;width:30px;height:30px;border-radius:50%;border:0;background:rgba(0,0,0,.65);color:#fff;font-size:20px;line-height:1;cursor:pointer}
.dgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.dtile{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:8px;text-align:left;cursor:pointer;display:flex;flex-direction:column;min-width:0}
.dtile.hid{opacity:.45}
.dimg{position:relative;aspect-ratio:5/7;border-radius:9px;overflow:hidden;background:var(--bg);margin-bottom:8px}
.dimg img{width:100%;height:100%;object-fit:cover}
.noph{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:26px;font-weight:700;color:var(--mute);gap:6px;border:1px dashed var(--line);border-radius:9px}
.noph small{font-size:11px;font-weight:500;color:var(--accent)}
.dbadge{position:absolute;left:6px;bottom:6px;font-size:10px;font-weight:700;padding:2px 7px;border-radius:999px;background:rgba(11,16,32,.8);color:#fff}
.dbadge.gr{left:auto;right:6px;background:#11402e;color:#8ff0c3}
.dpl{font-weight:600;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dds{font-size:11px;color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dpr{font-weight:700;font-size:14px;margin-top:4px}
.cimg{display:block;max-height:260px;max-width:100%;margin:0 auto 12px;border-radius:10px}
.item.warn{border-color:#6b5320;background:#2e2412}
.stk{position:absolute;left:6px;top:6px;font-style:normal;font-size:10px;font-weight:700;letter-spacing:.2px;padding:2px 7px;border-radius:999px;background:rgba(11,16,32,.82);color:#ffd08a;border:1px solid rgba(242,169,59,.55);pointer-events:none}
.stk.sm{left:0;right:0;top:auto;bottom:0;border-radius:0;border:0;padding:1px 0;font-size:7px;text-align:center}
.stk.inl{position:static;display:inline-block;vertical-align:1px}
.links .mini{margin:0}
/* v0.4 look: trading-app feel. Deeper surfaces, tabular figures, hero value + chart, change markers */
:root{--bg:#0a0e17;--card:#121826;--card2:#1a2233;--line:#222b3f;--mute:#8a94ad}
html,body{font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased}
header.top h1{font-size:26px;font-weight:800;letter-spacing:-.6px}
.prof,.item,.setcard,.crow,.dtile{border-color:var(--line)}
.btn{border-radius:13px;font-weight:650}
.sec{font-size:12px;letter-spacing:.7px;margin:22px 2px 9px}
.sec.row2{display:flex;align-items:center;justify-content:space-between}
.sec.row2 .seg{text-transform:none;letter-spacing:0}
nav.tabs{background:rgba(10,14,23,.9);border-top-color:var(--line)}
nav.tabs button{font-weight:600;font-size:10.5px;position:relative}
nav.tabs button.on::before{content:"";position:absolute;top:-7px;width:22px;height:3px;border-radius:0 0 3px 3px;background:var(--accent)}
.seg.sm button{padding:5px 11px;font-size:12px}.seg.wide.sm button{padding:7px;font-size:12.5px}
.seg.mode{border-radius:999px;padding:2px;flex:0 0 auto}.seg.mode button{border-radius:999px;padding:5px 12px;font-weight:600}
.seg.mode button.on{background:var(--accent);color:#fff}
.hero{padding:6px 2px 4px;margin-bottom:12px}
.hv{font-size:42px;font-weight:800;letter-spacing:-1.4px;line-height:1.1;margin-top:2px}
.hs{font-size:14px;margin-top:4px;color:var(--mute)}
.chg{display:inline-block;font-weight:650;font-size:12.5px;white-space:nowrap}
.chg.up{color:var(--ok)}.chg.dn{color:#ff6b68}.chg.fl{color:var(--mute)}.chg.own{color:#b9a2ff;font-weight:600;font-size:11px}
.hs .chg{font-size:14px}
.crow .r .chg{display:block;margin-top:2px}
.crow{border-radius:13px;padding:9px 12px}
.crow .r b{font-size:15px;font-weight:700}
.crow .tl{margin-top:4px;display:flex;align-items:center;flex-wrap:wrap;gap:2px}.crow .tl .sub{font-size:11px}
.chart{position:relative;margin:14px -2px 0;height:150px;touch-action:pan-y;outline:none;cursor:crosshair}
.chart svg{display:block;width:100%;height:132px}
.chart:focus-visible{box-shadow:0 0 0 2px var(--accent);border-radius:8px}
.cax{display:flex;justify-content:space-between;font-size:11px;color:var(--mute);margin-top:3px}
.hair{display:none;position:absolute;top:0;height:132px;width:1px;background:var(--mute);opacity:.6;pointer-events:none}
.cdot{display:none;position:absolute;width:10px;height:10px;border-radius:50%;margin:-5px 0 0 -5px;box-shadow:0 0 0 2px var(--bg);pointer-events:none}
.ctip{display:none;position:absolute;top:-6px;transform:translateX(-50%);background:var(--card2);border:1px solid var(--line);border-radius:9px;padding:4px 9px;font-size:11px;color:var(--mute);white-space:nowrap;pointer-events:none;text-align:center}
.ctip b{display:block;color:var(--text);font-size:13px}
.chart0{margin-top:14px;border:1px dashed var(--line);border-radius:12px;padding:18px 14px;font-size:13px;color:var(--mute);text-align:center}
.ranges{margin-top:10px}
.kpis.k4{grid-template-columns:repeat(4,1fr);gap:0;background:var(--card);border:1px solid var(--line);border-radius:var(--r);margin:0 0 12px;padding:10px 0}
.kpis.k4 div{background:none;border-radius:0;padding:0 10px;border-left:1px solid var(--line);min-width:0}.kpis.k4 div:first-child{border:0}
.kpis.k4 b{font-size:14px;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.kpis.k4 span{font-size:10.5px;text-transform:uppercase;letter-spacing:.5px}
.stack{display:flex;gap:2px;height:14px}.stack i{display:block;min-width:3px;border-radius:2px}.stack i:first-child{border-radius:4px 2px 2px 4px}.stack i:last-child{border-radius:2px 4px 4px 2px}.stack i:only-child{border-radius:4px}
table.bd{width:100%;border-collapse:collapse;margin-top:10px;font-size:13.5px}
table.bd td{padding:6px 0;border-top:1px solid var(--line)}table.bd tr:first-child td{border:0}
table.bd td:nth-child(2){text-align:right;font-weight:600}table.bd td:nth-child(3){text-align:right;width:44px}
.key{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:8px}
.acts{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:4px}
.acts button{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 6px;font-size:13px;font-weight:600;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:6px}
.acts button span{width:38px;height:38px;border-radius:50%;background:rgba(124,92,255,.16);color:#b9a2ff;display:flex;align-items:center;justify-content:center;font-size:18px}
.hscroll{display:flex;gap:10px;overflow-x:auto;margin:0 -14px;padding:0 14px 4px;scrollbar-width:none}.hscroll::-webkit-scrollbar{display:none}
.hcard{flex:0 0 132px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:8px;text-align:left;cursor:pointer;min-width:0}
.hcard .noph small{display:none}
.pick{display:block;width:100%;text-align:left;background:var(--bg);border:1px solid var(--line);border-radius:14px;padding:14px;margin-top:12px;cursor:pointer}
.pick b{display:block;font-size:17px;margin-bottom:3px}.pick span{font-size:13px;color:var(--mute)}
.pick:active{border-color:var(--accent)}

/* ===== v0.5 identity: "Cappd" matchday gold on night pitch ===== */
@font-face{font-family:Archivo;font-weight:800;font-display:swap;src:url(fonts/archivo-800.woff2) format("woff2")}
@font-face{font-family:Archivo;font-weight:900;font-display:swap;src:url(fonts/archivo-900.woff2) format("woff2")}
:root{--bg:#06090f;--card:#0e1422;--card2:#151d30;--line:#1d2740;--text:#f4f6fb;--mute:#8790aa;--accent:#f5c242;--accent-ink:#1a1305;--ok:#2fd38a;--bad:#ff5d6c;--r:18px;--disp:Archivo,-apple-system,"SF Pro Display",system-ui,sans-serif}
html,body{background:var(--bg)}
body::before{content:"";position:fixed;inset:0 0 auto;height:420px;background:radial-gradient(120% 70% at 85% -10%,rgba(245,194,66,.16),transparent 60%),radial-gradient(90% 60% at 0% 0%,rgba(47,211,138,.08),transparent 60%);pointer-events:none;z-index:0}
.app{position:relative;z-index:1;padding-bottom:calc(env(safe-area-inset-bottom) + 110px)}
header.top h1,.hv,.big,.csum b,.spv,.sheet h2,.goal b,.cab .medal b,.medal b{font-family:var(--disp)}
header.top h1{font-weight:900;font-size:30px;letter-spacing:-.8px}
.prof,.item,.setcard,.crow,.dtile,.hcard,.tile2,.goal,.nudge,.streak,.csum,.kpis.k4{border-radius:var(--r);background:linear-gradient(180deg,rgba(255,255,255,.025),rgba(255,255,255,0)),var(--card)}
.btn{background:var(--accent);color:var(--accent-ink);border-radius:14px;font-weight:750}
.btn.ghost{background:var(--card2);color:var(--text)}
.pill.on,.mini.acc{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:700}
.seg.mode button.on{background:var(--accent);color:var(--accent-ink)}
.seg{border-radius:12px}.seg button.on{background:var(--card2);color:var(--text);font-weight:650}
.banner{background:rgba(245,194,66,.08);border-color:rgba(245,194,66,.28);color:#f1e2b8;border-radius:14px}
.banner b{color:#fff}
a.src,.item a,.lnk{color:var(--accent)}
.lnk{background:none;border:0;font-size:12.5px;font-weight:650;cursor:pointer;text-transform:none;letter-spacing:0;padding:0}
.sec{color:#aab2c8;font-weight:750}
/* header */
header.top.home{gap:8px;padding-bottom:6px}
.brand{flex:1;display:flex;align-items:center;gap:8px;font:900 23px/1 var(--disp);letter-spacing:-.6px}
.logo{width:30px;height:30px;filter:drop-shadow(0 2px 8px rgba(245,194,66,.35))}
.chip-streak{display:flex;align-items:center;gap:4px;background:rgba(255,140,40,.12);border:1px solid rgba(255,140,40,.35);color:#ffb35c;border-radius:999px;padding:5px 10px 5px 7px;font-weight:800;font-size:13px;cursor:pointer}
.chip-streak svg{width:15px;height:15px}
/* hero */
.hero2{position:relative;overflow:hidden;border-radius:24px;padding:18px 16px 12px;margin:6px 0 12px;background:linear-gradient(160deg,#152038 0%,#0c1222 55%,#0a0f1b 100%);border:1px solid #22304f;box-shadow:0 20px 40px -24px rgba(0,0,0,.8),inset 0 1px 0 rgba(255,255,255,.05)}
.pitch{position:absolute;inset:0;opacity:.07;background:
 radial-gradient(circle at 100% 50%,transparent 58px,#fff 59px,#fff 60px,transparent 61px),
 linear-gradient(90deg,transparent calc(100% - 1px),#fff calc(100% - 1px)),
 repeating-linear-gradient(90deg,transparent 0 46px,rgba(255,255,255,.35) 46px 92px);mask-image:linear-gradient(180deg,#000,transparent 85%);-webkit-mask-image:linear-gradient(180deg,#000,transparent 85%)}
.hero2>*{position:relative}
.hg{font-size:12px;color:var(--accent);font-weight:700;letter-spacing:.3px}
.hl{font-size:13px;color:var(--mute);margin-top:8px}
.hero2 .hv{font-size:46px;font-weight:900;letter-spacing:-1.6px;line-height:1.05;margin-top:2px}
.hero2 .hs{display:flex;align-items:center;flex-wrap:wrap;gap:5px;margin-top:6px}
.dotsep{width:3px;height:3px;border-radius:50%;background:var(--mute);display:inline-block;margin:0 3px}
.hero2 .chart{margin-top:10px}
.hero2 .ranges{background:rgba(0,0,0,.25)}
/* streak */
.streak{display:flex;align-items:center;gap:12px;padding:12px 14px;margin-bottom:12px;border:1px solid rgba(255,140,40,.22);background:linear-gradient(100deg,rgba(255,120,30,.12),rgba(255,120,30,0) 60%),var(--card)}
.streak .fl{width:38px;height:38px;border-radius:12px;background:linear-gradient(160deg,#ff9a3c,#ff5d2a);color:#fff3d6;display:flex;align-items:center;justify-content:center;flex:0 0 auto;box-shadow:0 6px 16px -6px rgba(255,110,40,.7)}
.streak .fl svg{width:22px;height:22px}
.streak .st{flex:1;min-width:0}.streak .st b{display:block;font-size:15px}.streak .st span{font-size:11.5px;color:var(--mute);display:block;margin-top:1px}
.streak .wk{display:flex;gap:3px}
.streak .wk i{font-style:normal;width:17px;height:22px;border-radius:6px;background:var(--card2);color:var(--mute);font-size:9px;font-weight:700;display:flex;align-items:flex-end;justify-content:center;padding-bottom:3px}
.streak .wk i.on{background:linear-gradient(180deg,#ff9a3c,#ff6a2a);color:#fff}
.streak .wk i.today{outline:1.5px solid #ffb35c;outline-offset:1px}.streak .wk i.fut{opacity:.45}
/* quick actions */
.acts button{border-radius:18px;padding:14px 6px}
.acts button span{background:rgba(245,194,66,.14);color:var(--accent);font-weight:800}
.acts button span svg{width:20px;height:20px}
/* card art */
.art{position:relative;aspect-ratio:5/7;border-radius:12px;overflow:hidden;background:#0a0f1a;box-shadow:0 10px 22px -14px rgba(0,0,0,.9)}
.art img{width:100%;height:100%;object-fit:cover;display:block}
.art.gen{background:linear-gradient(155deg,hsl(var(--h) 55% 34%),hsl(calc(var(--h) + 40) 60% 14%) 70%);display:flex}
.gface{margin:7%;flex:1;border-radius:8px;border:1px solid rgba(255,255,255,.18);background:radial-gradient(120% 80% at 30% 0%,rgba(255,255,255,.18),transparent 55%);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;text-align:center;padding:6px}
.gin{font:900 34px/1 var(--disp);letter-spacing:-1px;color:rgba(255,255,255,.92);text-shadow:0 2px 12px rgba(0,0,0,.35)}
.gln{font-size:9.5px;font-weight:700;letter-spacing:.6px;text-transform:uppercase;color:rgba(255,255,255,.6)}
.gadd{position:absolute;left:0;right:0;bottom:30px;text-align:center;font-size:10.5px;font-weight:700;color:var(--accent)}
.art.gold{box-shadow:0 0 0 1.5px #f5c242,0 10px 26px -12px rgba(245,194,66,.55)}
.art.silver{box-shadow:0 0 0 1.5px #c8d0e0,0 10px 22px -14px rgba(200,208,224,.4)}
.art.gem{box-shadow:0 0 0 1.5px #2fd38a,0 10px 26px -12px rgba(47,211,138,.5)}
.art.holo{box-shadow:0 0 0 2px transparent,0 10px 26px -10px rgba(177,140,255,.6)}
.art.holo::after{content:"";position:absolute;inset:0;border-radius:12px;padding:2px;background:conic-gradient(from 0deg,#ff5d6c,#f5c242,#2fd38a,#4aa3ff,#b18cff,#ff5d6c);-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude;pointer-events:none}
.art .dbadge{bottom:7px;left:7px;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
.art .dbadge.gr{left:auto;right:7px}
.art.gold .dbadge:not(.gr){background:rgba(245,194,66,.92);color:var(--accent-ink)}
.mchg{position:absolute;top:7px;right:7px;background:rgba(6,9,15,.78);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);border-radius:999px;padding:2px 7px}
.mchg .chg{font-size:11px}
/* carousel + tiles */
.hcard{flex:0 0 138px;padding:8px}
.hcard .art{margin-bottom:8px}
.dgrid{gap:12px}
.dtile{padding:8px;border-radius:16px}.dtile .art{margin-bottom:9px}
.dprow{display:flex;align-items:baseline;justify-content:space-between;gap:6px;margin-top:3px}.dprow .dpr{margin:0}.dprow .chg{font-size:11.5px}
.dpr{font-weight:800}
/* card of the day */
.spot{display:flex;gap:14px;width:100%;text-align:left;padding:12px;border-radius:22px;border:1px solid var(--line);cursor:pointer;background:radial-gradient(120% 120% at 0% 0%,rgba(245,194,66,.14),transparent 55%),var(--card)}
.spot.holo{background:radial-gradient(120% 120% at 0% 0%,rgba(177,140,255,.2),transparent 55%),var(--card)}
.spa{flex:0 0 112px}
.spi{display:flex;flex-direction:column;justify-content:center;min-width:0;gap:2px}
.spi b{font:900 21px/1.1 var(--disp);letter-spacing:-.4px}
.spv{font:900 26px/1.1 var(--disp);margin-top:8px;letter-spacing:-.6px}
/* goals */
.goals{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.goal{display:flex;align-items:center;gap:10px;padding:12px;border:1px solid var(--line);text-align:left;cursor:pointer;min-width:0}
.goal b{display:block;font-size:15px;font-weight:800;letter-spacing:-.2px}.goal span{display:block;font-size:11.5px;color:var(--mute);margin-top:2px}
.goal svg{flex:0 0 auto}
.medals{display:flex;flex:0 0 auto}.medals .medal{width:30px;height:30px;margin-left:-8px;border:2px solid var(--card)}.medals .medal:first-child{margin-left:0}
.medal{width:56px;height:56px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:var(--card2);color:#4a5470;border:1px dashed #2a3552}
.medal svg{width:46%;height:46%}.medal b{font-weight:900;font-size:15px;letter-spacing:-.5px}
.medals .medal b{font-size:10px}.medals .medal svg{width:14px;height:14px}
.medal.on{background:radial-gradient(circle at 35% 25%,#fff2c2,#f5c242 45%,#b88412);color:#3a2805;border:0;box-shadow:0 4px 14px -4px rgba(245,194,66,.6),inset 0 -2px 0 rgba(0,0,0,.15)}
.cab{display:grid;grid-template-columns:repeat(3,1fr);gap:14px 8px;margin-top:16px}
.cb{display:flex;flex-direction:column;align-items:center;text-align:center;gap:6px}.cb b{font-size:12.5px}.cb span{font-size:10.5px;color:var(--mute);line-height:1.3}
.celebrate{text-align:center;padding:20px 4px 4px;position:relative}
.celebrate .medal{width:96px;height:96px;margin:0 auto}.celebrate .medal b{font-size:28px}
.burst{position:absolute;left:50%;top:68px;width:0;height:0}
.burst i{position:absolute;width:8px;height:14px;border-radius:2px;background:hsl(calc(var(--i) * 26) 90% 62%);transform:rotate(calc(var(--i) * 25.7deg)) translateY(-20px);animation:pop .9s cubic-bezier(.2,.8,.3,1) forwards;opacity:0}
@keyframes pop{0%{opacity:1;transform:rotate(calc(var(--i) * 25.7deg)) translateY(-20px)}100%{opacity:0;transform:rotate(calc(var(--i) * 25.7deg)) translateY(-110px)}}
/* nudges + explore */
.nudge{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:12px 14px;border:1px solid var(--line);margin-bottom:8px;cursor:pointer}
.nudge b{display:block;font-size:14.5px}.nudge span{display:block;font-size:12px;color:var(--mute);margin-top:2px}.nudge>div{flex:1;min-width:0}.nudge i{font-style:normal;color:var(--mute);font-size:22px}
.ti{width:38px;height:38px;border-radius:12px;background:rgba(245,194,66,.12);color:var(--accent);display:flex;align-items:center;justify-content:center;flex:0 0 auto}
.ti svg{width:20px;height:20px}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile2{display:flex;flex-direction:column;align-items:flex-start;gap:4px;text-align:left;padding:13px;border:1px solid var(--line);cursor:pointer}
.tile2 .ti{margin-bottom:6px}.tile2 b{font-size:14.5px}.tile2>span:last-child{font-size:11.5px;color:var(--mute)}
/* collection */
.csum{display:grid;grid-template-columns:1.6fr 1fr 1fr;border:1px solid var(--line);padding:12px 14px;margin-bottom:12px}
.csum>div{display:flex;flex-direction:column;gap:1px}.csum>div+div{border-left:1px solid var(--line);padding-left:12px}
.csum b{font-size:22px;font-weight:900;letter-spacing:-.6px}.csum .chg{font-size:12px}
.vt{flex:0 0 42px;background:var(--card);border:1px solid var(--line);border-radius:10px;color:var(--text);display:flex;align-items:center;justify-content:center;cursor:pointer}.vt svg{width:20px;height:20px}
.cth{width:44px;height:60px;border-radius:7px}
.cth[style*="--h"]{background:linear-gradient(155deg,hsl(var(--h) 55% 34%),hsl(calc(var(--h) + 40) 60% 14%));color:rgba(255,255,255,.9);font-family:var(--disp);font-weight:900}
.cth.gold{box-shadow:0 0 0 1.5px #f5c242}.cth.silver{box-shadow:0 0 0 1.5px #c8d0e0}.cth.gem{box-shadow:0 0 0 1.5px #2fd38a}.cth.holo{box-shadow:0 0 0 1.5px #b18cff}
/* card sheet hero */
.chero{position:relative;margin:-8px -16px 12px;padding:14px 16px 4px;overflow:hidden;border-radius:18px 18px 0 0}
.cbg{position:absolute;inset:-30px;background-size:cover;background-position:center;filter:blur(28px) saturate(1.3);opacity:.45}
.chero::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,transparent 40%,var(--card));pointer-events:none}
.chero .phs{position:relative;z-index:1;margin:0;padding:0}
.chero .ph{box-shadow:0 18px 30px -16px rgba(0,0,0,.9)}
.sheet{background:var(--card);border:1px solid var(--line);border-bottom:0}
.sheet .kv dd b{font-family:var(--disp);font-size:20px}
/* floating dock with a centre add button */
nav.tabs{left:12px;right:12px;bottom:calc(env(safe-area-inset-bottom) + 10px);border:1px solid #243052;border-radius:24px;padding:6px 4px;background:rgba(12,17,30,.86);box-shadow:0 18px 40px -12px rgba(0,0,0,.85);max-width:496px;margin:0 auto}
nav.tabs button{font-size:10.5px}
nav.tabs button.on{color:var(--accent)}
nav.tabs button.on::before{top:-7px;background:var(--accent)}
nav.tabs .fab{flex:0 0 72px}
nav.tabs .fab span{width:52px;height:52px;margin-top:-22px;border-radius:18px;background:linear-gradient(160deg,#ffd970,#f5c242 50%,#d69a1c);color:var(--accent-ink);display:flex;align-items:center;justify-content:center;box-shadow:0 10px 24px -6px rgba(245,194,66,.65),inset 0 1px 0 rgba(255,255,255,.6)}
nav.tabs .fab span svg{width:26px;height:26px}
.toast{border-color:rgba(245,194,66,.35)}
@media (prefers-reduced-motion: reduce){.burst{display:none}}
/* ---------- polish (Impeccable critique, 20 Nov 2026) ---------- */
/* one "your own value" tone instead of the leftover purple: a quiet steel colour with a dashed outline, so it reads as a caveat, not a feature */
:root{--own:#c4cce0;--ph:#98a1ba}
.pu{color:var(--own)}
.chg.own{color:var(--own);font-size:11.5px;font-weight:650;border:1px dashed rgba(196,204,224,.45);border-radius:999px;padding:1px 7px}
.crow .r .chg.own{display:inline-block;margin-top:4px}
.dpr.sale{color:var(--accent)}
.chip.c,.b-s{background:rgba(245,194,66,.12);color:#f1d27a}
.acts button span{background:rgba(245,194,66,.12);color:var(--accent)}
/* type floor: nothing under 11px, so tags and labels stay readable outdoors */
.gln{font-size:10.5px;letter-spacing:.5px;color:rgba(255,255,255,.72)}
.tag,.badge,.dbadge{font-size:11px}
.gadd{font-size:11.5px}
.dds{font-size:11.5px}
.mchg .chg{font-size:11.5px}
nav.tabs button{font-size:11px}
/* streak week: readable letters on every state */
.streak .wk i{font-size:10px;width:18px}
.streak .wk i.on{color:#2a1203}
.streak .wk i.fut{opacity:1;background:transparent;border:1px dashed var(--line);color:#6f7894}
/* touch targets: small controls keep their look but get a 44px tall hit area */
.lnk,.mini,.pill,.seg.mode button,.chip-streak,.tog{position:relative}
.lnk::after,.mini::after,.pill::after,.seg.mode button::after,.chip-streak::after,.tog::before{content:"";position:absolute;left:-4px;right:-4px;top:50%;height:44px;transform:translateY(-50%)}
/* browser surfaces in the palette */
::selection{background:rgba(245,194,66,.35);color:#fff}
input,textarea{caret-color:var(--accent)}
.inp::placeholder,.search::placeholder{color:var(--ph);opacity:1}
.inp:focus,.search:focus{border-color:rgba(245,194,66,.6)}
button:focus-visible,a:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
input[type=file].inp{padding:8px;color:var(--mute);font-size:13px}
input[type=file].inp::file-selector-button{font:inherit;font-weight:700;background:var(--card2);color:var(--text);border:1px solid var(--line);border-radius:10px;padding:8px 12px;margin-right:10px;cursor:pointer}
/* a closed sheet leaves the screen-reader and tab order too */
.sheet{visibility:hidden;transition:transform .25s ease,visibility 0s linear .25s}
.sheet.open{visibility:visible;transition:transform .25s ease}
/* first-run style picker */
.pick b em{font-style:normal;font-size:11px;font-weight:700;color:var(--accent-ink);background:var(--accent);border-radius:999px;padding:2px 8px;margin-left:8px;vertical-align:2px}
.pick.rec{border-color:rgba(245,194,66,.45)}
.skip{display:block;width:100%;background:none;border:0;color:var(--mute);font-size:13.5px;font-weight:600;padding:14px 0 4px;cursor:pointer}
/* price source line */
.srcl{display:block;margin-top:4px;font-size:11.5px;color:var(--mute)}
/* Display: cards with no photo fold into one row */
.needph{display:flex;align-items:center;gap:12px;width:100%;text-align:left;margin:4px 0 8px;padding:12px 14px;border-radius:var(--r);border:1px dashed rgba(245,194,66,.45);background:rgba(245,194,66,.06);cursor:pointer;color:var(--text)}
.needph .ti{color:var(--accent)}
.needph>div{flex:1;min-width:0}
.needph b{display:block;font-size:14.5px}
.needph span:not(.ti){display:block;font-size:12px;color:var(--mute);margin-top:2px}
.needph i{font-style:normal;font-weight:750;font-size:13px;color:var(--accent-ink);background:var(--accent);border-radius:999px;padding:6px 14px}
.needlist{margin-bottom:10px}
.needlist .r b.sale{color:var(--accent)}
/* Display carousel */
.dcar{margin:0 -14px 6px}
.dcnav{display:flex;align-items:center;justify-content:space-between;padding:0 16px 10px}
.dcnav b{color:var(--text)}
.dcarr{display:flex;gap:8px}
.arr{width:44px;height:44px;border-radius:50%;border:1px solid var(--line);background:var(--card);color:var(--text);font-size:24px;line-height:1;cursor:pointer;display:flex;align-items:center;justify-content:center;padding-bottom:3px}
.arr:active{border-color:var(--accent);color:var(--accent)}
.feed{display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;padding:0 30px 4px;scroll-padding:0 30px;overscroll-behavior-x:contain}
.feed::-webkit-scrollbar{display:none}
.dslide{flex:0 0 calc(100% - 60px);scroll-snap-align:center;scroll-snap-stop:always;background:linear-gradient(180deg,rgba(255,255,255,.03),rgba(255,255,255,0)),var(--card);border:1px solid var(--line);border-radius:22px;overflow:hidden}
.dslide.hid{opacity:.5}
.dsart{display:block;width:100%;border:0;padding:16px 16px 4px;cursor:pointer;background:radial-gradient(120% 90% at 50% 0%,#1d2640,transparent 70%)}
.dsart .art{width:min(100%,250px);margin:0 auto;border-radius:14px;box-shadow:0 22px 40px -18px rgba(0,0,0,.95)}
.dsart .gin{font-size:52px}
.dsi{padding:10px 16px 16px}
.dspl{display:block;font-family:var(--disp);font-size:21px;line-height:1.15;letter-spacing:-.2px}
.dsi>.sub{display:block;margin-top:2px}
.dstags{margin-top:8px}
.dsprice{margin-top:12px;padding:10px 12px;border-radius:14px;background:var(--bg);border:1px solid var(--line)}
.dsprice span{display:block;font-size:11px;font-weight:700;letter-spacing:.6px;text-transform:uppercase;color:var(--mute)}
.dsprice b{display:block;font-family:var(--disp);font-size:24px;margin-top:2px}
.dsprice b.sale{color:var(--accent)}
.dsprice i{display:block;font-style:normal;font-size:11.5px;color:var(--mute);margin-top:2px}
.dthumbs{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding:12px 16px 6px}
.dthumbs::-webkit-scrollbar{display:none}
.dth{flex:0 0 auto;border:0;background:none;padding:2px;border-radius:10px;cursor:pointer;opacity:.55;outline:2px solid transparent;transition:opacity .2s}
.dth.on{opacity:1;outline-color:var(--accent)}
</style>
</head>
<body>
<div class="app" id="app"></div>
<nav class="tabs"><div class="in">
  <button data-tab="home"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z"/></svg>Home</button>

const defaultPar = g => Math.max(0, g.pars.findIndex(p => p.r === 1 && !/Plate|Club|Rose|Gloves|Manufacturer/.test(p.n)));

// ---------- hunt: home ----------
// found = seen + reported + verified copies; ones = 1/1 parallels only
function tally(s, groups, onlyPar, idx){
  const um = unknownCounts();
  const t = { slots: 0, v: 0, p: 0, s: 0, ones: 0, onesF: 0, cards: 0 };
  for (const g of groups){ t.cards += g.cards.length;
    for (const par of g.pars){ if (onlyPar && par.n !== onlyPar) continue;
      for (const c of g.cards){
        t.slots += par.r; let got = 0;
        for (let n = 1; n <= par.r; n++){ const r = idx.get(slotKey(s.id, g.n, c[0], par.n, n)); if (r){ got++; r.status === 'verified' ? t.v++ : r.status === 'pending' ? t.p++ : t.s++; } }
        const unk = Math.min(par.r - got, (um.get(slotKey(s.id, g.n, c[0], par.n, 0)) || 0)); t.s += unk;
        if (par.r === 1){ t.ones++; if (got) t.onesF++; }
      }
    }
  }
  t.found = t.v + t.p + t.s;
  return t;
}
const pct = (n, d) => d ? n / d * 100 : 0;
const pctTxt = (n, d) => { const x = pct(n, d); return x === 0 ? '0%' : x < .1 ? '<0.1%' : x < 10 ? x.toFixed(1) + '%' : Math.round(x) + '%'; };
// stacked bar: verified, reported, seen; tiny non-zero values get a visible sliver
function sbar(t, total){
  const w = n => n ? Math.max(.8, pct(n, total)).toFixed(2) : 0;
  return `<div class="sbar"><i style="width:${w(t.v)}%;background:var(--ok)"></i><i style="width:${w(t.p)}%;background:var(--pend)"></i><i style="width:${w(t.s)}%;background:var(--seen)"></i></div>`;
}
// early on the share found is tiny, so lead with the count; the percentage and bar only show once they mean something (1% or more)
function progHtml(t, label, noOnes){
  const line = (n, of) => pct(n, of) >= 1 ? `<b>${n.toLocaleString()} of ${of.toLocaleString()} · ${pctTxt(n, of)}</b>` : `<b>${n.toLocaleString()} <span class="sub" style="font-weight:400">of ${of.toLocaleString()} tracked</span></b>`;
  return `<div class="prog"><div class="pl"><span>${label}</span>${line(t.found, t.slots)}</div>${pct(t.found, t.slots) >= 1 ? sbar(t, t.slots) : ''}
  ${t.ones && !noOnes ? `<div class="pl" style="margin-top:8px"><span>1/1s found</span>${line(t.onesF, t.ones)}</div>${pct(t.onesF, t.ones) >= 1 ? `<div class="sbar"><i style="width:${pct(t.onesF, t.ones).toFixed(2)}%;background:var(--accent)"></i></div>` : ''}` : ''}</div>`;
}
function renderHunt(){
  const idx = slotIndex();

  const all = { slots: 0, v: 0, p: 0, s: 0, found: 0, ones: 0, onesF: 0 }, per = SETS.map(s => tally(s, s.groups, null, idx));
  per.forEach(t => { for (const k in all) all[k] += t[k]; });
  h += `<div class="prof" style="padding:14px"><b>All 6 sets</b>${progHtml(all, 'Copies found')}

function renderSet(){
  const s = setById(view.set), g = s.groups[view.grp], par = g.pars[view.par], idx = slotIndex(), q = view.q.toLowerCase();
  let h = `<header class="top"><button class="back" data-act="home">‹ Sets</button></header>
  <h1 style="margin:0 0 2px;font-size:22px">${esc(short(s.name))}</h1>

  <div class="seg">${['all','open','found'].map(f => `<button data-filter="${f}" class="${view.filter === f ? 'on' : ''}">${f === 'all' ? 'All' : f === 'open' ? 'Open' : 'Found'}</button>`).join('')}</div></div>
  <div class="prof" style="padding:12px">${progHtml(tally(s, [g], par.n, idx), `${esc(par.n)} ${runTxt(par.r)} found`, true)}${(() => { const t = tally(s, [g], null, idx); return `<div class="pl" style="margin-top:8px"><span>All parallels in ${esc(g.n)}</span><b>${t.found} of ${t.slots.toLocaleString()} · ${pctTxt(t.found, t.slots)}</b></div>${sbar(t, t.slots)}`; })()}</div>
  <div class="legend"><span style="--c:var(--empty)">Not reported</span><span style="--c:var(--seen)">Seen on eBay</span><span style="--c:var(--pend)">Reported</span><span style="--c:var(--ok)">Verified</span></div>
  <div class="grid">`;
  let shown = 0;
  for (const c of g.cards){
    if (q && !(c[1].toLowerCase().includes(q) || c[2].toLowerCase().includes(q) || c[0].toLowerCase() === q)) continue;
    let dots = '', best = '', cnt = 0;
    for (let n = 1; n <= par.r; n++){
      const k = cls(idx.get(slotKey(s.id, g.n, c[0], par.n, n)));
      if (k){ cnt++; if (!best || 'spv'.indexOf(k) > 'spv'.indexOf(best)) best = k; }
      dots += `<i class="dot ${k}"></i>`;
    }
    const unk = unknownFor(s.id, g.n, c[0], par.n).length;
    if (view.filter === 'open' && cnt === par.r) continue;
    if (view.filter === 'found' && !cnt && !unk) continue;
    if (!best && unk) best = 's';
    shown++;
    h += `<div class="tile ${best === 'v' ? 'hasv' : best === 'p' ? 'hasp' : best === 's' ? 'hass' : ''}" data-card="${esc(c[0])}">
      <div class="no">${esc(cardNo(g, c[0]))} · ${cnt}/${par.r} found</div><div class="pl">${esc(c[1])}</div><div class="tm">${esc(c[2])}</div>
      ${unk ? `<div class="unk">+${unk} seen, copy number unknown</div>` : ''}
      <div class="dots">${dots}</div></div>`;
  }
  h += `</div>`;
  if (!shown) h += `<div class="empty">No cards match.</div>`;
  return h;
}

function shrink(file, max = 800, q = .7){
  return new Promise(res => { if (!file) return res(''); const fr = new FileReader(); fr.onload = () => { const img = new Image(); img.onload = () => {
    const k = Math.min(1, max / Math.max(img.width, img.height)), c = document.createElement('canvas'); c.width = img.width * k; c.height = img.height * k;
    c.getContext('2d').drawImage(img, 0, 0, c.width, c.height); res(c.toDataURL('image/jpeg', q)); }; img.src = fr.result; }; fr.readAsDataURL(file); });
}

const ago = iso => { const m = (Date.now() - Date.parse(iso)) / 6e4; return !(m >= 0) ? '' : m < 60 ? Math.max(1, Math.round(m)) + 'm ago' : m < 1440 ? Math.round(m / 60) + 'h ago' : m < 1440 * 7 ? Math.round(m / 1440) + 'd ago' : fmtDate(iso); };
const PARTICLES = new Set(['van', 'de', 'der', 'den', 'da', 'di', 'dos', 'el', 'al', 'ten', 'ter', 'le', 'la']);
// owned players, with the value of their cards so news about bigger holdings ranks first
function myPlayers(){
  const m = new Map();
  for (const c of S.cards.filter(owned)) for (const p of String(c.player || '').split(/\s*(?:\/|&|,|\+|\band\b)\s*/)){
    const name = p.trim(); if (!name) continue;
    const toks = norm(name).replace(/[^a-z'\s-]/g, ' ').split(/\s+/).filter(Boolean); if (!toks.length) continue;
    // surname = everything after the first name ("van de ven"); single names (Pedri) match on their own
    const sur = toks.length > 1 ? toks.slice(1) : toks;
    if (sur.join('').length < 4 && toks.length < 2) continue;
    const cur = m.get(name) || { name, sur: sur.length === 1 && sur[0].length < 4 ? toks : sur, v: 0, n: 0 };
    cur.v += (val(c).v || 0) * qty(c); cur.n += qty(c); m.set(name, cur);
  }
  return [...m.values()].sort((x, y) => y.v - x.v || y.n - x.n);
}
function tagNews(list, players){
  return list.map(n => { const w = new Set(n.n || []);
    const ps = players.filter(p => p.sur.every(t => w.has(t)) && !(p.sur.length === 1 && PARTICLES.has(p.sur[0])));
    const hrs = Math.max(0, (Date.now() - Date.parse(n.d)) / 36e5);
    return { ...n, ps, score: ps.length ? (1 + Math.log10(1 + Math.max(...ps.map(p => p.v)))) * Math.exp(-hrs / 72) : 0 }; });
}

const norm = x => String(x ?? '').normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase().trim();
const SET_HINTS = [[/merlin/i, 'merlin'], [/chrome/i, 'chrome'], [/pristine/i, 'pristine'], [/inception/i, 'inception'], [/museum/i, 'museum'], [/royalty/i, 'royalty']];
const OTHER_INSERTS = ['future stars'];   // insert names from other years that would otherwise match a base parallel
const HIT_GROUP = /auto|relic|signature|patch|swatch|material|book|ink|pen/i;
// returns { out: [candidate slots] } or { why: reason there is no match }
function matchInv(line, desc, player, serialTxt){
  const m = /(\d+)\s*\/\s*(\d+)/.exec(serialTxt || ''); if (!m) return { why: 'No serial number' };
  const serial = +m[1], run = +m[2];
  if (run > 25) return { why: 'Numbered higher than /25, not tracked' };
  const hint = SET_HINTS.find(h => h[0].test(line + ' ' + desc)); if (!hint) return { why: 'Not one of the 6 tracked sets' };
  const s = setById(hint[1]), pn = norm(player), d = norm(desc);
  const auto = /auto|patch|relic|sign/.test(d), patch = /patch|relic|jersey/.test(d);
  const named = s.groups.filter(g => g.n !== 'Base' && d.includes(norm(g.n.replace(/ \(.*\)/, ''))));
  const other = OTHER_INSERTS.find(w => d.includes(w));
  if (!named.length && other) return { why: `${short(s.name)} has no "${other}" insert, so this is probably a different year` };
  const out = [];
  for (const g of named.length ? named : s.groups){
    if (!named.length && HIT_GROUP.test(g.n) !== auto) continue;
    if (!named.length && patch && !/relic|patch|material|swatch/i.test(g.n)) continue;
    for (const c of g.cards){
      const cn = norm(c[1]); if (cn !== pn && !cn.split(/\s*[\/&,]\s*/).includes(pn)) continue;
      for (const par of g.pars) if (par.r === run && serial <= run) out.push({ set: s.id, grp: g.n, card: c[0], par: par.n, run, serial });
    }
  }
  if (out.length) return { out };
  const missing = auto && s.id === 'chrome' ? '. Chrome base autographs are not loaded yet' : auto && s.id === 'merlin' ? ". Some Merlin autographs are not loaded yet" : '';
  return { why: `No ${player} card numbered /${run} in ${short(s.name)}${missing}. Your sheet has no year, so it may be another season` };
}
const candTxt = c => { const g = grpOf(setById(c.set), c.grp); return `${short(setById(c.set).name)} · ${g.n} ${cardNo(g, c.card)} · ${c.par} ${c.run === 1 ? '1/1' : c.serial + '/' + c.run}`; };
function invRow(row, i){

  let h = `<div class="item"><div class="t">${esc(player)} · ${esc(serial)}</div><div class="m">${esc(line)} · ${esc(desc)}${/^C\d/.test(id) ? ' · ' + esc(id) : ''}</div>`;
  if (done) h += `<div style="margin-top:8px"><span class="badge b-p">ADDED · WAITING FOR REVIEW</span></div><div class="m" style="margin-top:4px">${esc(done)}</div>`;

    h += `<div class="m" style="margin-top:8px;color:var(--text)">${res.out.length > 1 ? 'Possible matches. Pick the one that is your card:' : 'Possible match. Check it is the 2025-26 card:'}</div>

  } else h += `<div class="m" style="margin-top:6px">${esc(res.why)}</div>`;
  return h + `</div>`;
}

const money = x => { if (x === null || x === undefined || x === '') return null; const n = parseFloat(String(x).replace(/[^0-9.\-]/g, '')); return isNaN(n) ? null : n; };
const sgd = n => n === null || n === undefined ? '–' : (n < 0 ? '−' : '') + 'S$' + Math.abs(n).toLocaleString('en-SG', { minimumFractionDigits: Math.abs(n) < 100 ? 2 : 0, maximumFractionDigits: Math.abs(n) < 100 ? 2 : 0 });
const owned = c => c.status !== 'Sold';
const isHit = c => !!(c.hit || c.serial || /yes/i.test(c.auto || '') || /yes/i.test(c.patch || ''));
const compsOf = c => (S.comps[c.id] || []).slice().sort((a, b) => (b.d || '').localeCompare(a.d || ''));
// value = latest sale you logged, then the sheet's comp price, then your own asking price (purple)
function val(c){
  const l = compsOf(c)[0];
  if (l) return { v: l.p, kind: 'sold', src: `Sale you logged (${l.s}${l.d ? ', ' + l.d : ''})`, via: l.s, d: l.d, n: compsOf(c).length };
  if (money(c.comp) !== null) return { v: money(c.comp), kind: 'sold', src: 'Comp price from your sheet' + (c.compDate ? ` (${c.compDate})` : ''), via: 'your sheet', d: c.compDate, n: 0 };
  if (money(c.ask) !== null) return { v: money(c.ask), kind: 'own', src: 'Your asking price, no sale logged yet' };
  return { v: null, kind: 'none', src: 'No value yet' };
}
// where a value came from, in plain words: "Last sold 6 Nov · eBay sold · 3 sales logged"
const shortDate = d => { if (!d) return ''; const m = /^(\d{4})-(\d{2})-(\d{2})/.exec(d); if (!m) return String(d);
  const t = new Date(+m[1], +m[2] - 1, +m[3]); return t.toLocaleDateString('en-SG', { day: 'numeric', month: 'short', ...(t.getFullYear() !== new Date().getFullYear() ? { year: 'numeric' } : {}) }); };
function srcLine(c, short){
  const x = val(c);
  if (x.kind === 'own') return short ? '' : 'Your asking price · no sale logged yet';
  if (x.kind === 'none') return short ? '' : 'No value yet';
  if (x.via === 'your sheet') return short ? (x.d ? `Comp ${shortDate(x.d)}` : 'Sheet comp') : `Comp from your sheet${x.d ? ' · ' + shortDate(x.d) : ' · no date'}`;
  const d = shortDate(x.d);
  if (short) return `Sold ${d || ''}${d ? ' · ' : ''}${x.via}`.replace(/^Sold $/, 'Sold');
  return `Last sold${d ? ' ' + d : ''} · ${x.via}${x.n > 1 ? ` · ${x.n} sales logged` : ''}`;
}
function tone(c){
  const x = val(c), cost = money(c.cost);
  if (x.kind === 'own') return 'pu';
  if (x.v === null || cost === null) return 'nt';
  return x.v - cost > 5 ? 'g' : x.v - cost <= -5 ? 'rd' : 'o';
}
const qty = c => +c.qty || 1;
const profitSold = c => money(c.sold) === null ? null : money(c.sold) - (money(c.cost) || 0);
const cardLine = c => [c.line && !c.desc.toLowerCase().includes(c.line.toLowerCase()) ? c.line : '', c.desc].filter(Boolean).join(' · ');

const CFILTERS = [['', 'All'], ['hits', 'Hits'], ['num', 'Numbered'], ['auto', 'Autos'], ['graded', 'Graded'], ['needs', 'Needs a comp'], ['pc', 'PC'], ['grade', 'To grade']];
function cardsList(){
  const q = norm(view.cq);
  let list = S.cards.filter(c => view.cseg === 'all' || (view.cseg === 'sold' ? !owned(c) : owned(c)));
  if (q) list = list.filter(c => norm([c.player, c.desc, c.line, c.brand, c.serial, c.id].join(' ')).includes(q));
  const f = view.cf;
  if (f === 'hits') list = list.filter(isHit);
  if (f === 'num') list = list.filter(c => c.serial);
  if (f === 'auto') list = list.filter(c => /yes/i.test(c.auto || '') || /auto/i.test(c.hit || ''));
  if (f === 'graded') list = list.filter(c => c.grade && c.grade !== 'Raw');
  if (f === 'needs') list = list.filter(c => owned(c) && isHit(c) && val(c).kind !== 'sold');
  if (f === 'pc') list = list.filter(c => c.status === 'PC');

}

  <div class="hint">US$ is converted at ${USD_SGD} to S$. Leave out shipping.</div>
  <div class="btns"><button class="btn ghost" type="button" data-act="skip">No sale found, skip</button><button class="btn">Save and next</button></div></form></div>`;
}
function bindComps(a){
  const f = a.querySelector('#sprint'), skip = view.cskip;
  if (f) f.onsubmit = e => { e.preventDefault(); let p = money(f.p.value); if (p === null) return toast('Type the sold price, or skip');

    view.cdone = (view.cdone || 0) + 1; toast(`${c.player}: ${sgd(p)} saved`); render(); window.scrollTo(0, 0); };
  a.querySelectorAll('[data-act=skip]').forEach(el => el.onclick = () => { const c = compQueue().find(x => !skip.has(x.id)); skip.add(c.id); render(); window.scrollTo(0, 0); });
  a.querySelectorAll('[data-act=unskip]').forEach(el => el.onclick = () => { skip.clear(); render(); });
}

// ---------- backup reminder ----------
const DAY = 864e5;
const daysAgo = t => Math.floor((Date.now() - t) / DAY);
function backupDue(){
  if (S.sampleCards || !S.changedAt) return false;
  if (S.backupAt && S.backupAt >= S.changedAt) return false;
  return Date.now() - (S.backupAt || S.importAt || S.changedAt) > 7 * DAY;
}
const backupWhen = () => S.backupAt ? `Last backup ${daysAgo(S.backupAt) ? daysAgo(S.backupAt) + (daysAgo(S.backupAt) === 1 ? ' day' : ' days') + ' ago' : 'today'}.` : 'No backup yet.';
const markBackup = () => { S.backupAt = Date.now(); save(true); };

// ---------- import / export ----------
function parseCSV(t){
  const rows = []; let row = [], cell = '', q = false;
  const sep = t.split('\n')[0].includes('\t') && !t.split('\n')[0].includes(',') ? '\t' : ',';
  for (let i = 0; i < t.length; i++){
    const ch = t[i];
    if (q){ if (ch === '"' && t[i + 1] === '"'){ cell += '"'; i++; } else if (ch === '"') q = false; else cell += ch; }
    else if (ch === '"') q = true;
    else if (ch === sep){ row.push(cell); cell = ''; }
    else if (ch === '\n' || ch === '\r'){ if (ch === '\r' && t[i + 1] === '\n') i++; row.push(cell); rows.push(row); row = []; cell = ''; }
    else cell += ch;
  }
  if (cell || row.length){ row.push(cell); rows.push(row); }
  return rows.filter(r => r.some(x => x.trim()));
}
const COLS = { id: ['id'], status: ['status'], hit: ['hit type'], sport: ['sport'], brand: ['brand'], line: ['product line'], desc: ['card / insert', 'card'], player: ['player'], serial: ['serial'], run: ['print run'],
  auto: ['auto'], patch: ['patch'], rc: ['rc'], grade: ['grade'], stage: ['grade stage'], qty: ['qty'], cost: ['total cost', 'bought for'], ask: ['asking'], sold: ['sold for'], soldDate: ['sold date'],
  channel: ['channel'], comp: ['comp price'], compDate: ['comp date'], search: ['comp search'], notes: ['notes'], photoF: ['photo front'], photoB: ['photo back'] };
function importRows(rows){
  const head = rows[0].map(x => x.trim().toLowerCase()), idx = {};
  for (const [k, names] of Object.entries(COLS)){
    let i = -1;
    for (const n of names){ i = head.findIndex(x => x === n); if (i < 0) i = head.findIndex(x => x.startsWith(n)); if (i >= 0) break; }
    idx[k] = i;
  }
  if (idx.player < 0 || idx.status < 0) return null;
  return rows.slice(1).map((r, n) => { const c = {}; for (const k in idx) c[k] = idx[k] >= 0 ? (r[idx[k]] || '').trim() : '';
    c.id = c.id || 'R' + (n + 1); ['cost', 'ask', 'sold', 'comp'].forEach(k => c[k] = money(c[k])); c.qty = +c.qty || 1; return c; })
    .filter(c => c.player && c.status && c.status !== 'Sealed');
}
function doImport(text){
  const cards = importRows(parseCSV(text));
  if (!cards || !cards.length) return toast('Could not read that. Use the Inventory tab saved as CSV.');
  S.cards = cards; S.sampleCards = false; S.invAdded = {}; S.importAt = S.importAt || Date.now(); save(); render();
  toast(`Imported ${cards.length} cards · ${cards.filter(owned).length} owned`);
}

// ---------- me ----------

  <div class="prof"><b>Back up</b><div class="sub" style="margin-top:4px">Your cards, photos, sales and reports only live in this app. Export now and then and keep the copy in Files or Google Drive. ${S.sampleCards ? '' : `<b class="${backupDue() ? 'rd' : ''}">${backupWhen()}</b>`}</div>
  <div class="btns"><button class="btn ghost" id="exp">${view.exp ? 'Hide' : 'Export data'}</button><button class="btn ghost" id="restore">Restore</button></div>
  ${view.exp ? `<textarea class="inp" id="expt" readonly style="margin-top:8px">${esc(JSON.stringify(S))}</textarea><div class="btns"><button class="btn" id="copyexp">Copy</button><button class="btn ghost" id="saveexp">Save as file</button></div>` : ''}
  ${view.rest ? `<textarea class="inp" id="restt" style="margin-top:8px" placeholder="Paste an export here"></textarea><button class="btn" id="restgo">Restore this backup</button>` : ''}</div>
  <div class="prof"><b>Tools</b><button class="btn ghost" data-act="badges">Trophy cabinet</button><button class="btn ghost" data-go="hunt">Card Finder (pull registry)</button><button class="btn ghost" data-go="news">News</button><button class="btn ghost" data-go="grade">Grading calculator</button><button class="btn ghost" data-go="scan">Scan my collection for the pull registry</button></div>
  ${pro() ? `<div class="prof"><b>Card Finder points</b>
  <div class="sub" style="margin-top:6px">Username</div><input class="inp" id="uname" value="${esc(S.user)}" style="margin-top:6px">
  <div class="sub" style="margin-top:10px">GitHub username, so finds you share publicly count here</div><input class="inp" id="ghname" value="${esc(S.gh || '')}" placeholder="e.g. belipede" autocapitalize="off" autocorrect="off" style="margin-top:6px">
  ${S.gh ? `<div class="hint">${myShared().length} shared finds from @${esc(S.gh)} on the public registry.</div>` : ''}
  <div style="display:flex;gap:20px;margin-top:14px"><div><div class="big">${pts}</div><div class="sub">points</div></div>
  <div><div class="big">${mine.filter(r => r.status === 'verified').length}</div><div class="sub">verified</div></div>
  <div><div class="big">${mine.filter(r => r.status === 'pending').length}</div><div class="sub">pending</div></div></div>
  <div class="bar" style="margin-top:14px"><i style="width:${Math.min(100, (pts % POINTS_PER_MONTH) / POINTS_PER_MONTH * 100)}%;background:var(--accent)"></i></div>
  <div class="sub" style="margin-top:6px">${earned ? 'Free month of Pro already earned this month (limit 1 a month).' : `${POINTS_PER_MONTH - (pts % POINTS_PER_MONTH)} points to a free month of Pro`}</div>
  ${pts >= POINTS_PER_MONTH && !earned ? `<button class="btn" id="claim">Claim free month of Pro</button>` : ''}
  <ul class="rules"><li>Only the first verified report of each numbered copy earns points.</li><li>1/1 = 100 · /5 or lower = 40 · /10 or lower = 20 · /25 or lower = 10</li>

  <div class="prof"><b>${pro() ? 'Testing' : 'Reset'}</b>
  ${pro() ? `<div class="switch"><span>Moderator mode<br><span class="sub">Lets you verify reports on this phone. Shared finds are verified with labels on GitHub.</span></span><button class="tog ${S.mod ? 'on' : ''}" id="mod" role="switch" aria-checked="${!!S.mod}" aria-label="Moderator mode"></button></div>
  <div class="switch"><span>Sample pull reports<br><span class="sub">Fills the registry with marked sample data</span></span><button class="pill" id="sample">${S.sampleLoaded ? 'Remove' : 'Load'}</button></div>` : ''}
  <div class="switch"><span>Start over<br><span class="sub">Deletes everything in this app. Export first.</span></span><button class="pill" id="clear">Delete</button></div></div>
  <p class="sub">Cappd test build ${APP_VERSION}. Checklists from collectosk.com and cardsmithsbreaks.com. Not affiliated with Topps, Panini or the leagues. Values are estimates, not financial advice.</p>`;
}

// ---------- grading calculator ----------
function renderGrade(){
  const g = view.g || (view.g = { raw: '', p10: '', p9: '', chance: 40, fee: 70 });
  const raw = money(g.raw), p10 = money(g.p10), p9 = money(g.p9), fee = money(g.fee) || 0, ch = Math.min(100, Math.max(0, +g.chance || 0)) / 100;
  const ev = p10 !== null && p9 !== null ? ch * p10 + (1 - ch) * p9 - fee : null;
  const todo = S.cards.filter(c => owned(c) && /to be graded/i.test(c.stage || ''));
  return `<header class="top"><button class="back" data-act="me">‹ Me</button></header><h1 style="margin:0 0 4px;font-size:22px">Grading calculator</h1>
  <div class="sub">Is grading worth it? Use real sold prices for the graded card (eBay sold or 130point).</div>
  ${todo.length ? `<div class="sec">Your cards marked to be graded</div>${todo.map(c => `<div class="crow" data-graw="${esc(c.id)}"><div class="l"><div class="pl">${esc(c.player)}</div><div class="ds">${esc(cardLine(c))}</div></div><div class="r"><b class="${tone(c)}">${sgd(val(c).v)}</b><span>tap to use</span></div></div>`).join('')}` : ''}
  <div class="prof" style="margin-top:12px"><form id="gf">
  <label class="f">Raw value now (S$)</label><input class="inp" name="raw" inputmode="decimal" value="${esc(g.raw)}">
  <div class="btns"><div style="flex:1"><label class="f">PSA 10 sells for</label><input class="inp" name="p10" inputmode="decimal" value="${esc(g.p10)}"></div><div style="flex:1"><label class="f">PSA 9 sells for</label><input class="inp" name="p9" inputmode="decimal" value="${esc(g.p9)}"></div></div>
  <div class="btns"><div style="flex:1"><label class="f">Chance of a 10 (%)</label><input class="inp" name="chance" inputmode="numeric" value="${esc(g.chance)}"></div><div style="flex:1"><label class="f">All-in cost (S$)</label><input class="inp" name="fee" inputmode="decimal" value="${esc(g.fee)}"></div></div>
  <div class="hint">PSA through a Singapore sender is about S$55–90 a card all-in; TAG via Newtro from S$33.</div></form>
  ${ev !== null ? `<dl class="kv"><dt>Expected after grading</dt><dd><b>${sgd(ev)}</b></dd><dt>Raw now</dt><dd>${sgd(raw)}</dd><dt>Difference</dt><dd class="${raw === null ? '' : ev - raw >= 0 ? 'g' : 'rd'}">${raw === null ? '–' : (ev - raw >= 0 ? '+' : '') + sgd(ev - raw)}</dd></dl>
  <div class="item" style="margin-top:12px"><div class="t">${raw === null ? 'Add the raw value to compare' : ev - raw > 10 ? 'Worth grading' : ev - raw > 0 ? 'Only just worth it' : 'Keep it raw'}</div><div class="m">Based on a ${Math.round(ch * 100)}% chance of a 10, otherwise a 9. Lower grades would make it worse.</div></div>` : '<div class="hint">Add both graded prices to see the answer.</div>'}</div>`;
}

// ---------- bug report ----------
function bugUrl(){
  const body = `**What happened**\n\n\n**What you expected**\n\n\n---\nScreen: ${view.tab}${view.set ? ' / ' + view.set : ''}\nVersion: ${APP_VERSION}\nDevice: ${navigator.userAgent}\nHome Screen app: ${navigator.standalone || matchMedia('(display-mode: standalone)').matches ? 'yes' : 'no'}`;
  return `https://github.com/${REPO}/issues/new?title=${encodeURIComponent('Bug: ')}&body=${encodeURIComponent(body)}`;
}

// ---------- bindings for the collection side ----------
function bindApp(a){
  a.querySelectorAll('[data-c]').forEach(el => el.onclick = () => openC(el.dataset.c));
  a.querySelectorAll('[data-cf]').forEach(el => el.addEventListener('click', () => { view.cf = el.dataset.cf; view.cmore = 60; if (view.tab === 'cards') render(); }));
  a.querySelectorAll('[data-cseg]').forEach(el => el.onclick = () => { view.cseg = el.dataset.cseg; view.cmore = 60; render(); });
  a.querySelectorAll('[data-act=bug]').forEach(el => el.onclick = () => window.open(bugUrl(), '_blank'));
  a.querySelectorAll('[data-act=addcard]').forEach(el => el.onclick = openAdd);
  a.querySelectorAll('[data-act=more]').forEach(el => el.onclick = () => { view.cmore += 60; render(); });
  a.querySelectorAll('[data-dg]').forEach(el => el.onclick = () => { view.dg = el.dataset.dg; view.dpos = 0; render(); });
  a.querySelectorAll('[data-act=dhidden]').forEach(el => el.onclick = () => { view.dhidden = !view.dhidden; render(); });
  a.querySelectorAll('[data-act=dnoph]').forEach(el => el.onclick = () => { view.dnoph = !view.dnoph; render(); });
  a.querySelectorAll('[data-dview]').forEach(el => el.onclick = () => { view.dview = el.dataset.dview; render(); });
  bindCarousel(a);
  a.querySelectorAll('[data-act=saletext]').forEach(el => el.onclick = async () => { try { await navigator.clipboard.writeText(saleText()); toast('Sale post copied. Paste it into Instagram, Facebook or Carousell.'); } catch (e) { openSheet(`<h2>Sale post</h2><textarea class="inp" style="min-height:220px">${esc(saleText())}</textarea><div class="hint">Select all and copy.</div>`); } });
  a.querySelectorAll('[data-act=backup]').forEach(el => el.onclick = () => { view.exp = true; view.rest = false; go('me'); const t = $('#expt'); if (t) t.scrollIntoView({ block: 'center' }); });
  bindComps(a);
  a.querySelectorAll('[data-setmode]').forEach(el => el.onclick = () => setMode(el.dataset.setmode));
  a.querySelectorAll('[data-range]').forEach(el => el.onclick = () => { view.range = el.dataset.range; render(); });
  a.querySelectorAll('[data-mv]').forEach(el => el.onclick = () => { view.mv = el.dataset.mv; render(); });
  a.querySelectorAll('[data-bd]').forEach(el => el.onclick = () => { view.bd = el.dataset.bd; render(); });
  a.querySelectorAll('[data-cview]').forEach(el => el.onclick = () => { view.cview = el.dataset.cview; render(); });
  a.querySelectorAll('[data-act=badges]').forEach(el => el.onclick = openBadges);
  a.querySelectorAll('[data-graw]').forEach(el => el.onclick = () => { const c = S.cards.find(x => x.id === el.dataset.graw); view.g.raw = String(val(c).v ?? ''); render(); });
  const cs = $('#csort'); if (cs) cs.onchange = () => { view.csort = cs.value; render(); };
  const cq = $('#cq'); if (cq) cq.oninput = () => { view.cq = cq.value; view.cmore = 60; const pos = cq.selectionStart; render(); const n = $('#cq'); n.focus(); n.setSelectionRange(pos, pos); };
  const gf = $('#gf'); if (gf) gf.oninput = e => { view.g[e.target.name] = e.target.value; const nm = e.target.name, pos = e.target.selectionStart; render(); const n = $('#gf')[nm]; n.focus(); try { n.setSelectionRange(pos, pos); } catch (x) {} };
  const go2 = $('#csvgo'); if (go2) go2.onclick = () => { const fl = $('#csvfile').files[0]; if (fl){ const fr = new FileReader(); fr.onload = () => doImport(fr.result); fr.readAsText(fl); } else if ($('#csvtext').value.trim()) doImport($('#csvtext').value); else toast('Pick a CSV file or paste the text'); };
  const us = $('#usesample'); if (us) us.onclick = () => { S.cards = SAMPLE_CARDS.map(c => ({ ...c })); S.sampleCards = true; save(); render(); toast('Sample collection back'); };
  const ex = $('#exp'); if (ex) ex.onclick = () => { view.exp = !view.exp; view.rest = false; render(); };
  const rs = $('#restore'); if (rs) rs.onclick = () => { view.rest = !view.rest; view.exp = false; render(); };
  const ce = $('#copyexp'); if (ce) ce.onclick = async () => { const ta = $('#expt'); try { await navigator.clipboard.writeText(ta.value); markBackup(); toast('Copied. Paste it somewhere safe, like Notes.'); } catch (e) { ta.select(); toast('Select all the text and copy it'); } };
  const se = $('#saveexp'); if (se) se.onclick = () => { const b = new Blob([JSON.stringify(S)], { type: 'application/json' }), u = URL.createObjectURL(b), l = document.createElement('a'); l.href = u; l.download = `cappd-backup-${new Date().toISOString().slice(0, 10)}.json`; l.click(); markBackup(); render(); setTimeout(() => URL.revokeObjectURL(u), 1000); };
  const rg = $('#restgo'); if (rg) rg.onclick = () => { try { const d = JSON.parse($('#restt').value); if (!Array.isArray(d.cards) || !Array.isArray(d.reports)) throw 0; S = d; S.comps = S.comps || {}; S.invAdded = S.invAdded || {}; S.photos = S.photos || {}; view.rest = false; S.backupAt = Date.now(); save(true); render(); toast('Backup restored'); } catch (e) { toast('That is not a Cappd export'); } };
  const cl = $('#clear'); if (cl) cl.onclick = () => { if (cl.dataset.armed){ localStorage.removeItem(KEY); location.hash = ''; location.reload(); } else { cl.dataset.armed = 1; cl.textContent = 'Tap again'; } };
}

touchStreak();
const h0 = location.hash.slice(1); if (ROUTES.includes(h0)) view.tab = h0;
render();

// ---------- live data ----------
// news.json is refreshed by a GitHub Action every 6 hours, finds.json whenever a Card Finder issue changes.
async function refreshData(){
  const get = f => fetch(`data/${f}?t=${Math.floor(Date.now() / 3e5)}`, { cache: 'no-cache' }).then(r => r.ok ? r.json() : null).catch(() => null);
  const [n, f] = await Promise.all([get('news.json'), get('finds.json')]);
  let changed = false;
  if (n && Array.isArray(n.items) && n.pulled !== NEWS.pulled){ NEWS = n; changed = true; }
  if (f && Array.isArray(f.finds) && JSON.stringify(f) !== JSON.stringify(FINDS)){ FINDS = { finds: f.finds, penalties: f.penalties || {} }; sharedCache = null; changed = true; }
  const typing = document.activeElement && /INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName);
  if (changed && !typing && view.tab !== 'me' && view.tab !== 'grade') render();
}
refreshData();
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') refreshData(); });
