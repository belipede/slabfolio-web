name: Update shared finds

on:
  issues:
    types: [opened, edited, closed, reopened, labeled, unlabeled, deleted]
  schedule:
    - cron: '41 3 * * *'     # daily safety net
  workflow_dispatch:
  pull_request:
    paths: ['scripts/update_finds.py', '.github/workflows/finds.yml']

permissions:
  contents: write
  issues: read

concurrency:
  group: data-commit
  cancel-in-progress: false

jobs:
  finds:
    # only Card Finder issues trigger a rebuild
    if: github.event_name != 'issues' || contains(github.event.issue.body, 'slabfolio-find')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check the parser on saved issues
        run: python3 scripts/update_finds.py --fixture tests/fixtures/issues.json --dry-run
      - name: Read issues
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/update_finds.py ${{ github.event_name == 'pull_request' && '--dry-run' || '' }}
      - name: Commit if changed
        if: github.event_name != 'pull_request'
        run: |
          git diff --quiet data/finds.json && exit 0
          git config user.name 'slabfolio-bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/finds.json
          git commit -m 'Update shared Card Finder finds'
          git pull --rebase origin main && git push
