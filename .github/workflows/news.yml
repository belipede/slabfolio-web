name: Refresh news

on:
  schedule:
    - cron: '17 */6 * * *'   # every 6 hours
  workflow_dispatch:
  pull_request:              # dry run on PRs that touch the news code, to check every feed still works
    paths: ['scripts/update_news.py', 'data/news-feeds.json', '.github/workflows/news.yml']

permissions:
  contents: write

concurrency:
  group: data-commit
  cancel-in-progress: false

jobs:
  news:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check the parser on saved feeds
        run: python3 scripts/update_news.py --fixtures tests/fixtures --dry-run
      - name: Fetch feeds
        run: python3 scripts/update_news.py ${{ github.event_name == 'pull_request' && '--dry-run' || '' }}
      - name: Commit if changed
        if: github.event_name != 'pull_request'
        run: |
          git diff --quiet data/news.json && exit 0
          git config user.name 'slabfolio-bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/news.json
          git commit -m 'Refresh news headlines'
          git pull --rebase origin main && git push
